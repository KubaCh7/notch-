name: Preview Sounds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-26
    steps:
      - name: Render pitched Pop variants
        run: |
          mkdir out
          afconvert -f WAVE -d LEI16 /System/Library/Sounds/Pop.aiff out/pop.wav
          python3 - <<'PY'
          import wave
          src = wave.open("out/pop.wav", "rb")
          p = src.getparams()
          frames = src.readframes(src.getnframes())
          src.close()
          # Same rates as SoundPlayer.Effect.rate (varispeed = resample).
          for name, rate in [("plug", 1.0), ("unplug", 0.82), ("airpods", 1.15)]:
              w = wave.open(f"out/{name}.wav", "wb")
              w.setnchannels(p.nchannels)
              w.setsampwidth(p.sampwidth)
              w.setframerate(int(p.framerate * rate))
              w.writeframes(frames)
              w.close()
          PY
          rm out/pop.wav
          for f in out/*.wav; do afconvert -f m4af -d aac -b 128000 "$f" "${f%.wav}.m4a"; done
          ls -la out
      - name: Push previews to a temporary branch
        run: |
          cd out
          git init -q -b sound-previews
          git add *.m4a
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Sound previews"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sound-previews
      - uses: actions/upload-artifact@v4
        with:
          name: sound-previews
          path: out
          retention-days: 3
