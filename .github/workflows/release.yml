name: Build DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project NotchPlus.xcodeproj \
            -scheme NotchPlus \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Create DMG
        run: |
          APP=build/Build/Products/Release/NotchPlus.app
          test -d "$APP"
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Notch+" -srcfolder dmg -ov -format UDZO NotchPlus.dmg
          ls -lh NotchPlus.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: NotchPlus-dmg
          path: NotchPlus.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Old rolling release; its tag would shadow /releases/latest.
          gh release delete latest --yes --cleanup-tag || true
          TAG="v1.0.${{ github.run_number }}"
          NOTES="$(git log -1 --pretty=%s)"
          gh release create "$TAG" NotchPlus.dmg \
            --title "Notch+ ${TAG#v}" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$NOTES"
